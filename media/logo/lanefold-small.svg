<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Lanefold at 32 px and below: a bigger ribbon, no commits, no fine detail. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#2d1c52"/>
    </linearGradient>
    <linearGradient id="shade" x1="40" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d22" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b0d22" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="down"><polygon points="40,36 124,36 124,220 40,136"/></clipPath>
    <clipPath id="across"><polygon points="40,136 216,136 216,220 124,220"/></clipPath>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#down)">
    <rect x="40" y="36" width="28" height="184" fill="#b497fb"/>
    <rect x="68" y="36" width="28" height="184" fill="#5aa9ff"/>
    <rect x="96" y="36" width="28" height="184" fill="#ffb862"/>
  </g>
  <g clip-path="url(#across)">
    <rect x="40" y="136" width="176" height="28" fill="#b497fb"/>
    <rect x="40" y="164" width="176" height="28" fill="#5aa9ff"/>
    <rect x="40" y="192" width="176" height="28" fill="#ffb862"/>
    <rect x="40" y="136" width="176" height="84" fill="url(#shade)"/>
  </g>
</svg>
