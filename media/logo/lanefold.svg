<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Lanefold: three lanes of history fold into an L, with commits on the main lane. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a4f"/>
      <stop offset="1" stop-color="#2d1c52"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- The folded part darkens towards the crease. -->
    <linearGradient id="shade" x1="54" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d22" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0b0d22" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="down"><polygon points="54,46 126,46 126,210 54,138"/></clipPath>
    <clipPath id="across"><polygon points="54,138 202,138 202,210 126,210"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <!-- The lanes run down… -->
  <g clip-path="url(#down)">
    <rect x="54" y="46" width="24" height="164" fill="#b497fb"/>
    <rect x="78" y="46" width="24" height="164" fill="#5aa9ff"/>
    <rect x="102" y="46" width="24" height="164" fill="#ffb862"/>
  </g>
  <!-- …fold over along the crease and run on. -->
  <g clip-path="url(#across)">
    <rect x="54" y="138" width="148" height="24" fill="#b497fb"/>
    <rect x="54" y="162" width="148" height="24" fill="#5aa9ff"/>
    <rect x="54" y="186" width="148" height="24" fill="#ffb862"/>
    <rect x="54" y="138" width="148" height="72" fill="url(#shade)"/>
  </g>
  <line x1="54" y1="138" x2="126" y2="210" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <!-- Commits on the main lane, before and after the fold. -->
  <g fill="#ffffff" stroke="#1f2550" stroke-width="6">
    <circle cx="90" cy="80" r="15"/>
    <circle cx="168" cy="174" r="15"/>
  </g>
</svg>
